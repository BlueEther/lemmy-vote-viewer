<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Error {{ status_code }} · Lemmy Vote Viewer</title>
  <link rel="stylesheet" href="{{ app_prefix }}/static/style.css">
</head>
<body>
<main class="wrap">
  <section class="error-page">
    <div class="error-code">ERROR {{ status_code }}</div>
    <h1>Something went wrong</h1>
    <div class="error-message{% if status_code == 404 %} federation-haiku{% endif %}">
      {% for paragraph in message_paragraphs %}
        <p>{{ paragraph }}</p>
      {% endfor %}
    </div>
    {% if status_code == 401 and lemmy_login_url %}
      <a class="filter-button" href="{{ lemmy_login_url }}">Log in to Lemmy</a>
    {% endif %}
    <a class="filter-button" href="{{ app_prefix }}/">Return to Vote Viewer</a>
  </section>

  {% include "_footer.html" %}
</main>
</body>
</html>
