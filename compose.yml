services:
  vote-viewer:
    build: .
    image: lemmy-vote-viewer
    container_name: lemmy-vote-viewer

    restart: unless-stopped

    env_file:
      - .env

    networks:
      - lemmy-network

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 128

networks:
  lemmy-network:
    external: true
    name: ${LEMMY_NETWORK:-lemmy-easy-deploy_default}
