name: lemmy-vote-viewer-local

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env.local}

    environment:
      POSTGRES_DB: lemmy
      POSTGRES_USER: lemmy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
      VOTE_VIEWER_PASSWORD: ${VOTE_VIEWER_PASSWORD:?Set VOTE_VIEWER_PASSWORD in .env.local}

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-vote-viewer.sh:/docker-entrypoint-initdb.d/10-vote-viewer.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemmy -d lemmy"]
      interval: 5s
      timeout: 5s
      retries: 12

  vote-viewer:
    build: .
    image: lemmy-vote-viewer-local

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.local}
      APP_PREFIX: ${APP_PREFIX:-/}
      PAGE_SIZE: ${PAGE_SIZE:-100}
      ENABLE_DOMAIN_SEARCH: ${ENABLE_DOMAIN_SEARCH:-false}
      ENABLE_INSTANCE_CONTENT_COUNTS: ${ENABLE_INSTANCE_CONTENT_COUNTS:-true}
      ENABLE_COMMUNITY_CONTENT_COUNTS: ${ENABLE_COMMUNITY_CONTENT_COUNTS:-true}
      ENABLE_USER_VOTE_GRAPHS: ${ENABLE_USER_VOTE_GRAPHS:-true}
      ENABLE_COMMUNITY_VOTE_GRAPHS: ${ENABLE_COMMUNITY_VOTE_GRAPHS:-true}
      ENABLE_INSTANCE_VOTE_GRAPHS: ${ENABLE_INSTANCE_VOTE_GRAPHS:-true}
      ENABLE_USERS_OVERVIEW: ${ENABLE_USERS_OVERVIEW:-false}
      USER_VOTE_GRAPH_CACHE_SECONDS: ${USER_VOTE_GRAPH_CACHE_SECONDS:-300}
      OVERVIEW_VOTE_GRAPH_CACHE_SECONDS: ${OVERVIEW_VOTE_GRAPH_CACHE_SECONDS:-1800}
      USERS_OVERVIEW_CACHE_SECONDS: ${USERS_OVERVIEW_CACHE_SECONDS:-1800}
      INSTANCE_QUERY_TIMEOUT_SECONDS: ${INSTANCE_QUERY_TIMEOUT_SECONDS:-12}
      VOTE_WINDOW_DAYS: ${VOTE_WINDOW_DAYS:-30}
      LEMMY_BASE_URL: ${LEMMY_BASE_URL:-https://example.com}
      LEMMY_INTERNAL_URL: ${LEMMY_INTERNAL_URL:-https://example.com}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-none}
      AUTH_SEARCH_REQUIRE: ${AUTH_SEARCH_REQUIRE:-none}
      AUTH_INSTANCE_REQUIRE: ${AUTH_INSTANCE_REQUIRE:-none}
      AUTH_ALLOWED_USERS: ${AUTH_ALLOWED_USERS:-}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-jwt}
      AUTH_CACHE_SECONDS: ${AUTH_CACHE_SECONDS:-60}
      AUTH_TIMEOUT_SECONDS: ${AUTH_TIMEOUT_SECONDS:-3}
      TIMEZONE: ${TIMEZONE:-UTC}

    ports:
      - "127.0.0.1:${VIEWER_PORT:-8080}:8080"

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 128

volumes:
  postgres-data:
